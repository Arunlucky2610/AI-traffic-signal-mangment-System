<!DOCTYPE html>
<html>
<head>
    <title>API Key Quick Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .warning { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        #map { width: 100%; height: 400px; border: 2px solid #ccc; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🔍 Google Maps API Quick Test</h1>
    
    <div id="results"></div>
    
    <button onclick="testAPIKey()">🔑 Test API Key</button>
    <button onclick="loadMap()">🗺️ Load Map</button>
    <button onclick="clearResults()">🧹 Clear Results</button>
    
    <div id="map"></div>
    
    <script>
        const API_KEY = 'AIzaSyBMsd9I-opTwbD8Wg0YEnYmoB4WArIqSSs';
        const results = document.getElementById('results');
        
        function addResult(message, type = 'success') {
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            results.appendChild(div);
        }
        
        function clearResults() {
            results.innerHTML = '';
        }
        
        function testAPIKey() {
            addResult('🔍 Testing API key configuration...', 'warning');
            addResult(`🔑 API Key: ${API_KEY.substring(0, 10)}...${API_KEY.slice(-4)}`, 'success');
            addResult(`📏 API Key Length: ${API_KEY.length} characters`, 'success');
            
            if (API_KEY.length !== 39) {
                addResult('⚠️ Warning: Google API keys are typically 39 characters long', 'warning');
            }
            
            // Test if we can reach the Google Maps API
            const testScript = document.createElement('script');
            testScript.src = `https://maps.googleapis.com/maps/api/js?key=${API_KEY}&callback=testCallback`;
            
            window.testCallback = function() {
                addResult('✅ Google Maps API loaded successfully!', 'success');
                addResult('🎉 API key is valid and working!', 'success');
                loadMap();
            };
            
            window.gm_authFailure = function() {
                addResult('❌ Authentication failed! API key is invalid or restricted', 'error');
                addResult('🔧 Possible fixes:', 'warning');
                addResult('   • Check API key in Google Cloud Console', 'warning');
                addResult('   • Add localhost to authorized domains', 'warning');
                addResult('   • Enable Maps JavaScript API', 'warning');
                addResult('   • Enable billing for your project', 'warning');
            };
            
            testScript.onerror = function() {
                addResult('❌ Failed to load Google Maps API script', 'error');
                addResult('🔍 This could indicate network issues or invalid API key', 'error');
            };
            
            document.head.appendChild(testScript);
        }
        
        function loadMap() {
            if (!window.google || !window.google.maps) {
                addResult('❌ Google Maps API not loaded. Click "Test API Key" first.', 'error');
                return;
            }
            
            addResult('🗺️ Creating map...', 'warning');
            
            try {
                const map = new google.maps.Map(document.getElementById('map'), {
                    zoom: 13,
                    center: { lat: 17.3850, lng: 78.4867 }, // Hyderabad HITEC City
                });
                
                new google.maps.Marker({
                    position: { lat: 17.3850, lng: 78.4867 },
                    map: map,
                    title: 'Hyderabad HITEC City'
                });
                
                addResult('✅ Map created successfully!', 'success');
                addResult('🎯 Google Maps is working perfectly!', 'success');
                
            } catch (error) {
                addResult(`❌ Map creation failed: ${error.message}`, 'error');
            }
        }
        
        // Auto-start test
        setTimeout(() => {
            addResult('🚀 Ready to test! Click "Test API Key" to begin.', 'warning');
        }, 500);
    </script>
</body>
</html>
